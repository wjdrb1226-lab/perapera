
<!DOCTYPE html>
<html lang="ko">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>공지사항 작성 | 인천공항 주차예약</title>

    <link rel="stylesheet" href="../css/notice/notice_write.css">
</head>

<body>

    <!-- 공통 헤더 -->
    <div id="header"></div>

    <!-- 메인 영역 -->
    <main class="noticeWrite">

        <div class="noticeTitle">
            <h1>공지사항 작성</h1>
            <p>새로운 공지사항을 작성할 수 있습니다.</p>
        </div>

        <form action="#" method="post" enctype="multipart/form-data">

            <div class="writeTable">

                <!-- 제목 -->
                <div class="writeRow">
                    <label for="noticeTitle">제목</label>

                    <input
                        type="text"
                        id="noticeTitle"
                        name="noticeTitle"
                        placeholder="공지사항 제목을 입력하세요."
                        required>
                </div>

                <!-- 작성자 -->
                <div class="writeRow">
                    <label for="writer">작성자</label>

                    <input
                        type="text"
                        id="writer"
                        name="writer"
                        value="관리자"
                        readonly>
                </div>

                <!-- 중요공지 -->
                <div class="writeRow">
                    <label for="important">중요공지</label>

                    <div class="checkArea">
                        <input
                            type="checkbox"
                            id="important"
                            name="important"
                            value="Y">

                        <label for="important" class="checkLabel">
                            중요공지로 등록
                        </label>
                    </div>
                </div>

                <!-- 내용 -->
                <div class="writeRow contentRow">
                    <label for="noticeContent">내용</label>

                    <textarea
                        id="noticeContent"
                        name="noticeContent"
                        placeholder="공지사항 내용을 입력하세요."
                        required></textarea>
                </div>

                <!-- 첨부파일 -->
                <div class="writeRow">
                    <label for="attachFile">첨부파일</label>

                    <div class="fileArea">
                        <input
                            type="file"
                            id="attachFile"
                            name="attachFile"
                            accept=".pdf,.hwp,.hwpx,.png,.jpg,.jpeg">

                        <p class="fileInfo">
                            PDF, HWP, HWPX, PNG, JPG, JPEG 파일만 등록 가능합니다.
                            (최대 10MB)
                        </p>
                    </div>
                </div>

            </div>

            <!-- 버튼 영역 -->
            <div class="writeBtn">

                <a href="notice_list.html" class="cancelBtn">
                    취소
                </a>

                <button type="submit" class="submitBtn">
                    등록
                </button>

            </div>

        </form>

    </main>

    <!-- 공통 푸터 -->
    <div id="footer"></div>

    <!-- 공통 헤더 및 푸터 불러오기 -->
    

</body>
</html>
